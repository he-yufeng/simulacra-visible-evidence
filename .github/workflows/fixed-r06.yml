name: Fixed r06 public-synthetic comparison
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fixed-r06-method
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r benchmark-requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SituatedEvals/public
          ref: 0d2332d8ae19a8ce171031142bdc97134910e7ec
          path: _reference
          persist-credentials: false
      - name: One bounded fixed comparison
        run: python -B tools/run_r06.py
