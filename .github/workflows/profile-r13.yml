name: One owned calibration workload diagnostic
on:
  push:
    branches: [diagnostics/calibration-r13-20261005-r00]
    paths:
      - tools/profile_r13_calibration.py
      - .github/workflows/profile-r13.yml
permissions:
  contents: read
concurrency:
  group: r13-owned-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir -r participant_r13/requirements.txt
      - name: New owned fixture only; no survey seed, grader or old controls
        run: python -B tools/profile_r13_calibration.py
      - name: Publish only generated synthetic aggregate receipt to stdout
        run: python -c 'import json,pathlib; print("PROFILE_RECEIPT_JSON " + json.dumps(json.loads(pathlib.Path("r13_calibration_profile_2026-10-05_r00.json").read_text()),sort_keys=True))'
