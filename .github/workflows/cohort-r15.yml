name: Frozen r15 shared-network cohort
on:
  push:
    branches: [tuning/shared-network-r15-20261005-c1, tuning/shared-network-r15-20261005-c2]
    paths:
      - participant_r15/**
      - tools/native_r15_cohort.py
      - tests/test_participant_r15.py
      - R15_SHARED_NETWORK_PROTOCOL.md
      - R15_SOURCE_MANIFEST.json
      - R15_COHORT1_SUMMARY.json
      - r15-benchmark-requirements.txt
      - .github/workflows/cohort-r15.yml
permissions:
  contents: read
concurrency:
  group: cohort-r15-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      R15_COHORT: ${{ endsWith(github.ref_name, '-c2') && '2' || '1' }}
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir -r r15-benchmark-requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SituatedEvals/public
          ref: 0d2332d8ae19a8ce171031142bdc97134910e7ec
          path: _reference
          persist-credentials: false
      - name: One exact-ZIP full-synthetic shared-network cohort
        run: python -B tools/native_r15_cohort.py
