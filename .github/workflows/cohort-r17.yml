name: Frozen r17 schema-order cohort
on:
  push:
    branches: [tuning/schema-order-r17-20261006-c1, tuning/schema-order-r17-20261006-c2]
    paths:
      - participant_r17/**
      - tools/native_r17_cohort.py
      - tests/test_participant_r17.py
      - R17_SCHEMA_ORDER_PROTOCOL.md
      - R17_SOURCE_MANIFEST.json
      - R17_COHORT1_SUMMARY.json
      - r17-benchmark-requirements.txt
      - .github/workflows/cohort-r17.yml
permissions:
  contents: read
concurrency:
  group: cohort-r17-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      R17_COHORT: ${{ endsWith(github.ref_name, '-c2') && '2' || '1' }}
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PIP_NO_CACHE_DIR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --no-cache-dir -r r17-benchmark-requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SituatedEvals/public
          ref: 0d2332d8ae19a8ce171031142bdc97134910e7ec
          path: _reference
          persist-credentials: false
      - name: One exact-ZIP full-synthetic schema-order cohort
        run: python -B tools/native_r17_cohort.py
