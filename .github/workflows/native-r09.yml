name: Frozen r09 native Linux archive contract
on:
  push:
    branches: [tuning/crossfit-r09-20261005]
    paths:
      - participant_r09/**
      - tests/test_participant_r09.py
      - tools/native_r09.py
      - R09_SOURCE_MANIFEST.json
      - .github/workflows/native-r09.yml
      - benchmark-requirements.txt
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-r09-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir -r benchmark-requirements.txt
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: SituatedEvals/public
          ref: 0d2332d8ae19a8ce171031142bdc97134910e7ec
          path: _reference
          persist-credentials: false
      - name: One independent actual-ZIP native contract
        run: python -B tools/native_r09.py
